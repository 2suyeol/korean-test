<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>국어 수행 카드 — 사자성어 · 맞춤법</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1f2328;--sub:#6b6f76;--line:#e4e0d6;--accent:#2f6f5e;--accent2:#e8f2ee;--ok:#2e7d4f;--okbg:#e6f4ea;--no:#c0392b;--nobg:#fbe9e7;--star:#d4880f}
@media (prefers-color-scheme:dark){:root{--bg:#16181b;--card:#202327;--ink:#ecebe7;--sub:#a3a7ad;--line:#33373c;--accent:#6cc3a6;--accent2:#1f3530;--ok:#6fcf97;--okbg:#1d3326;--no:#ff8a7a;--nobg:#3a2220;--star:#f2b33d}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;line-height:1.55;-webkit-tap-highlight-color:transparent}
.wrap{max-width:640px;margin:0 auto;padding:18px 16px 60px}
header{display:flex;align-items:center;gap:10px;margin-bottom:14px}
header h1{font-size:19px;margin:0;font-weight:800;letter-spacing:-.3px}
header .back{border:none;background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:6px 11px;font-size:14px;cursor:pointer;font-family:inherit}
.sec{font-size:13px;color:var(--sub);font-weight:700;margin:22px 2px 8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:left;cursor:pointer;font-family:inherit;color:var(--ink);transition:transform .08s}
.btn-card:active{transform:scale(.98)}
.btn-card b{display:block;font-size:15px;margin-bottom:2px}
.btn-card span{font-size:12.5px;color:var(--sub)}
.btn-card.hero{grid-column:1/-1;background:var(--accent);color:#fff;border:none;padding:18px}
.btn-card.hero span{color:rgba(255,255,255,.85)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
.meta{display:flex;justify-content:space-between;font-size:13px;color:var(--sub);margin-bottom:8px}
.bar{height:5px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:14px}
.bar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.tag{display:inline-block;font-size:11.5px;font-weight:700;color:var(--accent);background:var(--accent2);border-radius:6px;padding:2px 7px;margin-bottom:8px}
.q{font-size:17px;font-weight:500;margin:4px 0 16px;word-break:keep-all}
.opts{display:grid;gap:8px}
.opt{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:12px 14px;font-size:16px;text-align:left;cursor:pointer;font-family:inherit}
.opt:hover{border-color:var(--accent)}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.no{border-color:var(--no);background:var(--nobg)}
.opt:disabled{cursor:default}
.tokens{display:flex;flex-wrap:wrap;gap:7px;margin:4px 0 6px}
.tok{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:9px 11px;font-size:17px;cursor:pointer;font-family:inherit}
.tok.ok{border-color:var(--ok);background:var(--okbg)}
.tok.no{border-color:var(--no);background:var(--nobg)}
input.ans{width:100%;font-size:20px;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font-family:inherit}
input.ans:focus{outline:none;border-color:var(--accent)}
.primary{width:100%;margin-top:12px;background:var(--accent);color:#fff;border:none;border-radius:12px;padding:13px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
.ghost{width:100%;margin-top:8px;background:transparent;color:var(--sub);border:1px solid var(--line);border-radius:12px;padding:11px;font-size:14px;cursor:pointer;font-family:inherit}
.fb{margin-top:14px;border-radius:12px;padding:12px 14px;font-size:14.5px}
.fb.ok{background:var(--okbg)}
.fb.no{background:var(--nobg)}
.fb .v{font-weight:800;margin-bottom:4px}
.fb .rule{margin-top:6px;color:var(--sub);font-size:13.5px}
.big{font-size:26px;font-weight:800;letter-spacing:1px}
.flip{min-height:220px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;cursor:pointer;user-select:none}
.flip .hint{font-size:12px;color:var(--sub);margin-top:14px}
.row{display:flex;gap:8px}
.row button{flex:1}
.no-btn{background:var(--no)!important}
.rule-item{border-bottom:1px solid var(--line);padding:12px 2px}
.rule-item:last-child{border-bottom:none}
.rule-item h3{margin:0 0 4px;font-size:15px}
.rule-item p{margin:0;font-size:14px;color:var(--ink)}
.rule-item .ex{font-size:13px;color:var(--sub);margin-top:4px}
.star{color:var(--star)}
.score{font-size:44px;font-weight:800;text-align:center;margin:6px 0}
.wl{font-size:14px;border-top:1px solid var(--line);padding:9px 0}
.wl b{color:var(--ok)}
.wl s{color:var(--no)}
.note{font-size:12.5px;color:var(--sub);margin-top:10px}
.pill{display:inline-block;background:var(--nobg);color:var(--no);font-weight:700;border-radius:20px;padding:1px 8px;font-size:12px;margin-left:4px}
.seg{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:6px 12px;font-size:13px;cursor:pointer;font-family:inherit}
.seg button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
/* ========== 사자성어 59 ========== */
const IDIOMS=[
["각골난망","刻骨難忘","입은 은혜에 대한 고마운 마음이 뼈에까지 사무쳐 잊혀지지 아니함"],
["각주구검","刻舟求劍","시대의 변천을 모르고 융통성 없이 어리석음 (배에 표시해 두고 칼을 찾음)"],
["감탄고토","甘呑苦吐","달면 삼키고 쓰면 뱉음. 신의를 돌보지 않고 개인적 이익만 꾀함"],
["갑남을녀","甲男乙女","이름도 알려지지 않은 평범한 사람"],
["갑론을박","甲論乙駁","서로 자기주장을 내세우고 상대방의 주장을 반박함"],
["건곤일척","乾坤一擲","운명과 흥망을 걸고 단판걸이로 승부나 성패를 겨룸"],
["격세지감","隔世之感","오래되지 않은 동안 변화가 심하여 딴 세대처럼 아주 달라진 느낌"],
["견강부회","牽强附會","이치에 맞지 않는 말을 억지로 끌어 붙여 자기 주장에 맞도록 함"],
["결자해지","結者解之","맺은 사람이 풀어야 함. 일을 저지른 사람이 해결해야 함"],
["결초보은","結草報恩","풀을 엮어 은혜를 갚음. 죽어서도 잊지 않고 은혜를 갚음"],
["경국지색","傾國之色","나라를 기울게 할 만큼 나라 안에 으뜸가는 미인"],
["고진감래","苦盡甘來","쓴 것이 다하면 단 것이 옴. 고생 끝에 즐거움이 옴"],
["곡학아세","曲學阿世","학문을 왜곡하여 세상 사람들에게 아첨함"],
["과유불급","過猶不及","정도를 지나침은 미치지 못한 것과 같음"],
["관포지교","管鮑之交","관중과 포숙아 같은, 시세를 떠나 친구를 위하는 두터운 우정"],
["괄목상대","刮目相對","눈을 비비고 다시 봄. 못 본 사이에 깜짝 놀랄 정도로 발전함"],
["구밀복검","口蜜腹劍","입에는 꿀, 배에는 칼. 말로는 친한 체하나 속으로는 해칠 생각을 품음"],
["군계일학","群鷄一鶴","닭 무리 속의 학. 평범한 사람 가운데 뛰어난 사람"],
["권토중래","捲土重來","한 번 실패한 사람이 세력을 회복해 다시 공격(도전)해 옴"],
["근묵자흑","近墨者黑","먹을 가까이하면 검어짐. 나쁜 사람과 사귀면 버릇에 물들기 쉬움"],
["난형난제","難兄難弟","누구를 형이라 하고 아우라 할지 어려움. 우열을 가리기 어려움"],
["남가일몽","南柯一夢","남쪽 가지 밑의 꿈. 인생의 부귀영화가 한낱 꿈에 지나지 않음 (유사어: 일장춘몽)"],
["낭중지추","囊中之錐","주머니 속의 송곳. 재능 있는 사람은 많은 사람 속에서도 드러남"],
["맥수지탄","麥秀之嘆","보리가 무성함을 보고 고국의 멸망을 탄식함 (유사어: 망국지탄)"],
["명약관화","明若觀火","불을 보는 듯이 환하게 분명히 알 수 있음"],
["목불인견","目不忍見","차마 눈으로 볼 수 없을 정도로 참혹하거나 볼품없는 모습"],
["무위도식","無爲徒食","아무 하는 일 없이 먹기만 함"],
["발본색원","拔本塞源","폐단의 근원을 아주 뽑아 없애 버림"],
["본말전도","本末顚倒","일의 처음과 나중이 뒤바뀜. 근본은 잊고 사소한 부분에 사로잡힘 (유사어: 주객전도)"],
["부화뇌동","附和雷同","제 주견 없이 남이 하는 대로 따르거나 같이 행동함"],
["비분강개","悲憤慷慨","슬프고 분하여 마음이 복받침"],
["사상누각","砂上樓閣","모래 위의 누각. 기초가 튼튼하지 못해 오래 견디지 못함"],
["사필귀정","事必歸正","무슨 일이든 결국은 옳은 데로 돌아감"],
["새옹지마","塞翁之馬","인간 만사의 길흉화복은 변화무쌍하여 예측할 수 없음"],
["수구초심","首丘初心","여우는 죽을 때 머리를 살던 굴로 향함. 고향을 그리워하는 마음"],
["아전인수","我田引水","제 논에 물 대기. 자기 좋을 대로 이기적으로 행동함"],
["안분지족","安分知足","편한 마음으로 제 분수를 지키며 만족을 앎"],
["안빈낙도","安貧樂道","가난한 생활 속에서도 편안한 마음으로 도를 즐김"],
["양두구육","羊頭狗肉","양 머리를 걸고 개고기를 팖. 겉은 그럴듯하나 속은 허술함"],
["어불성설","語不成說","말이 이치에 맞지 않음. 어처구니없는 말"],
["연하고질","煙霞痼疾","자연을 매우 사랑하는 것이 고치지 못할 병이 든 것과 같음"],
["와신상담","臥薪嘗膽","섶에 눕고 쓸개를 맛봄. 목적을 이루기 위해 온갖 고난을 참고 견딤"],
["유명무실","有名無實","이름만 있고 실상은 없음"],
["유유자적","悠悠自適","속세를 떠나 아무것에도 속박되지 않고 조용하고 편안히 생활함"],
["일벌백계","一罰百戒","한 사람을 벌줌으로써 여러 사람에게 경각심을 불러일으킴"],
["자가당착","自家撞着","자기의 언행이 앞뒤가 모순되어 일치하지 않음 (유사어: 모순, 이율배반)"],
["자격지심","自激之心","자기가 한 일에 대해 스스로 미흡하게 여기는 마음"],
["자승자박","自繩自縛","자기 줄로 자기를 묶음. 자기 언행 때문에 자신이 꼼짝 못하게 됨"],
["자업자득","自業自得","제가 저지른 일의 과보(인과응보)를 제가 받음"],
["재자가인","才子佳人","재주 있는 남자와 아름다운 여자"],
["전대미문","前代未聞","지금까지 들어본 일이 없는 새로운 일"],
["전전반측","輾轉反側","누워서 이리저리 뒤척이며 잠을 이루지 못함"],
["절치부심","切齒腐心","몹시 분하여 이를 갈며 속을 썩임"],
["점입가경","漸入佳境","갈수록 점점 더 재미있는 경지로 들어감 (꼴불견이 심해짐을 비유하기도 함)"],
["좌불안석","坐不安席","불안이나 근심으로 가만히 앉아 있지 못함"],
["중과부적","衆寡不敵","적은 수효로는 많은 수효를 대적하지 못함"],
["학수고대","鶴首苦待","학의 목처럼 목을 길게 늘여 몹시 기다림"],
["호사다마","好事多魔","좋은 일에는 흔히 방해되는 일이 많이 생김"],
["토사구팽","兎死狗烹","토끼가 죽으면 사냥개를 삶음. 쓸모가 없어지면 헌신짝처럼 버려짐"]
];
const GROUPS=[["자가당착","자승자박","자업자득","자격지심","결자해지"],["안분지족","안빈낙도","유유자적","연하고질","무위도식"],["와신상담","절치부심","권토중래","비분강개","건곤일척"],["각골난망","결초보은","관포지교","수구초심"],["양두구육","구밀복검","유명무실","사상누각","감탄고토","토사구팽"],["군계일학","낭중지추","경국지색","재자가인","갑남을녀"],["고진감래","새옹지마","호사다마","사필귀정","남가일몽"],["견강부회","아전인수","어불성설","갑론을박","곡학아세","부화뇌동"],["격세지감","괄목상대","전대미문","점입가경"],["좌불안석","전전반측","학수고대","목불인견"]];

/* ========== 맞춤법 규정 요약 ========== */
const RULES={
r1:["제1·2항 총칙",1,"한글 맞춤법은 <b>표준어</b>를 <b>소리대로</b> 적되, <b>어법에 맞도록</b> 함을 원칙으로 한다. 문장의 각 <b>단어</b>는 띄어 씀을 원칙으로 한다.","대상=표준어 / 원리①=소리대로 / 원리②=어법에 맞도록"],
r5:["제5항 된소리",1,"한 단어 안에서 뚜렷한 까닭 없이 나는 된소리는 된소리로 적는다(두 모음 사이, ㄴ·ㄹ·ㅁ·ㅇ 받침 뒤). 다만 <b>ㄱ·ㅂ 받침 뒤</b>의 된소리는 된소리로 적지 않는다.","어깨, 기쁘다, 산뜻하다, 훨씬 / 국수, 깍두기, 법석, 갑자기, 몹시"],
r6:["제6항 구개음화",1,"ㄷ·ㅌ 받침 뒤에 -이/-히가 와서 ㅈ·ㅊ으로 소리 나도 <b>ㄷ·ㅌ으로</b> 적는다.","맏이, 해돋이, 굳이, 같이, 걷히다, 닫히다"],
r8:["제8항 ㅖ",1,"'계, 례, 몌, 폐, 혜'의 ㅖ는 ㅔ로 소리 나도 <b>ㅖ</b>로 적는다. 다만 <b>게송, 게시판, 휴게실</b>은 본음대로 ㅔ.","계수, 혜택, 사례, 폐품, 핑계, 계시다"],
r9:["제9항 ㅢ",1,"'의'나 자음+ㅢ는 ㅣ로 소리 나도 <b>ㅢ</b>로 적는다.","의의, 닁큼, 띄어쓰기, 무늬, 씌어, 희망, 하늬바람, 늴리리, 유희"],
r10:["제10항 두음 법칙(녀·뇨·뉴·니)",1,"단어 첫머리의 녀·뇨·뉴·니 → 여·요·유·이. ★다만 의존 명사 <b>냥, 년</b>(몇 년)은 그대로. 첫머리가 아니면 본음(남녀, 당뇨). 접두사처럼 쓰이는 말이나 합성어의 뒷말은 두음 법칙 적용(신여성, 공염불, 남존여비).","여자, 연세, 익명 / 남녀, 은닉 / 신여성"],
r11:["제11항 두음 법칙(랴·려·례·료·류·리)",1,"단어 첫머리 → 야·여·예·요·유·이. ★의존 명사 <b>리(里, 理)</b>는 본음(몇 리냐, 그럴 리가). 첫머리 외엔 본음(선량, 협력). ★다만 <b>모음이나 ㄴ 받침 뒤의 렬·률 → 열·율</b>. 준말은 본음(국련).","양심, 역사, 이발 / 나열, 분열, 선율, 비율, 백분율, 실패율 (cf. 합격률)"],
r12:["제12항 두음 법칙(라·래·로·뢰·루·르)",1,"단어 첫머리 → 나·내·노·뇌·누·느. 첫머리 외엔 본음(쾌락, 극락, 왕래). 접두사처럼 쓰인 한자 뒤는 두음 법칙(중노동, 비논리적).","낙원, 내일, 노인, 누각 / 쾌락, 지뢰 / 중노동"],
r13:["제13항 겹쳐 나는 소리",1,"한 단어 안에서 같거나 비슷한 음절이 겹치면 <b>같은 글자</b>로 적는다.","딱딱, 꼿꼿하다, 놀놀하다, 연연불망, 유유상종, 누누이, 짭짤하다, 씁쓸하다"],
r15:["제15항 어간과 어미",1,"어간과 어미는 구별해 적는다. ★붙임1: 두 용언이 어울릴 때 앞말의 <b>본뜻이 유지</b>되면 원형을 밝히고(넘어지다), <b>본뜻에서 멀어지면</b> 밝히지 않는다(<b>드러나다, 사라지다, 쓰러지다</b>). 붙임2: 종결 어미 '-오'는 '오'로(오시오). 붙임3: 연결형 '-이요'는 '이요'로.","넘어지다, 늘어나다, 떨어지다 / 드러나다, 사라지다"],
r16:["제16항 -아/-어",1,"어간 끝음절 모음이 ㅏ·ㅗ이면 '-아', 그 밖이면 '-어'.","막아, 얇아, 돌아 / 개어, 겪어, 되어, 쉬어"],
r17:["제17항 조사 -요",1,"어미 뒤에 붙는 조사 '-요'는 '-요'로 적는다. 조사 '-요'는 <b>생략 가능</b>(읽어요→읽어), 어미 '-오'는 생략 불가.","읽어요, 참으리요, 좋지요"],
r18:["제18항 불규칙 활용",1,"어간·어미가 원칙에서 벗어나면 벗어나는 대로 적는다. ㄹ탈락, ㅅ불규칙(그어), ㅎ불규칙(그러니), ㅜ·ㅡ탈락(퍼, 담가), ㄷ불규칙(걸어), ㅂ불규칙(구워; 단 <b>돕다·곱다는 도와, 고와</b>), 여불규칙(하여), ★러불규칙(이르러, 노르러, 푸르러), 르불규칙(갈라, 불러).","담가(○)/담궈(×), 도와(○)/도워(×), 가까워(○)/가까와(×)"],
r19:["제19항 -이·-음, -이·-히 접미사",1,"어간에 -이/-음(명사), -이/-히(부사)가 붙으면 원형을 밝힌다. 다만 뜻이 멀어진 것은 안 밝힘(굽도리, 목거리, 코끼리, 거름, 노름). 붙임: 다른 모음 접미사가 붙은 것은 안 밝힘(마개, 무덤, 쓰레기, 주검, 너무, 도로, 차마, 비로소).","미닫이, 얼음, 웃음, 앎, 만듦, 같이, 굳이, 밝히"],
r22:["제22항-2 -치-, -뜨리-, -트리-",1,"'-치-, -뜨리-, -트리-'가 붙은 말은 어간을 밝혀 적는다. (예는 시험!)","놓치다, 덮치다, 받치다, 밭치다, 부딪치다, 엎치다, 쏟뜨리다, 찢뜨리다, 흩뜨리다"],
r25:["제25항 -히/-이 부사",1,"'-하다'가 붙는 어근에 -히/-이가 붙어 부사가 되면 어근을 밝힌다(꾸준히, 도저히, 깨끗이). '-하다'가 붙지 않으면 소리대로(<b>갑자기, 반드시(꼭), 슬며시</b>). 부사에 -이가 붙어도 원형을 밝힌다(곰곰이, 더욱이, 일찍이).","도저히 ← 도저하다 / 반드시(꼭) ≠ 반듯이(반듯하게)"],
r26:["제26항 -하다, -없다",2,"'-하다', '-없다'가 붙은 용언은 그것을 밝혀 적는다.","딱하다, 숱하다, 착하다 / 부질없다, 상없다, 시름없다, 하염없다"],
r27:["제27항 붙임2·3",1,"어원이 분명하지 않으면 원형을 밝히지 않는다(<b>며칠</b>, 골병, 골탕, 끌탕, 아재비, 오라비, 업신여기다, 부리나케). 이(齒)가 합성어에서 '니'로 소리 나면 '니'로(사랑니, 덧니, 어금니). (예는 시험!)","며칠(○)/몇일(×)"],
r30:["제30항 사이시옷",1,"<b>순우리말 합성어</b> 또는 <b>순우리말+한자어 합성어</b>로, 앞말이 <b>모음</b>으로 끝나고 ① 뒷말 첫소리가 된소리로 나거나 ② 'ㄴ'이 덧나거나 ③ 'ㄴㄴ'이 덧나면 사이시옷을 적는다. ★한자어끼리는 <b>곳간, 셋방, 숫자, 찻간, 툇간, 횟수</b> 6개만.","나뭇가지, 냇가, 햇볕 / 잇몸, 빗물 / 나뭇잎, 깻잎 / 전셋집, 훗날 / 개수·대가·초점(×사이시옷)"],
r33:["제32·33항 준말",2,"끝모음이 줄고 자음만 남으면 앞 음절 받침으로(엊저녁, 갖고). 체언과 조사가 줄면 준 대로(그건, 그게, 난, 날, 뭘).","기럭아, 엊그저께, 딛고 / 그걸로, 무에"],
r34:["제34항 ㅏ·ㅓ 준말",2,"ㅏ·ㅓ로 끝난 어간 + -아/-어, -았/-었 → 준 대로(가, 갔다, 서, 섰다). 붙임: ㅐ·ㅔ 뒤도 준 대로(개, 갰다, 베, 벴다). '하여'→'해'.","켜, 켰다, 펴, 폈다, 했다"],
r35:["제35항 ㅘ·ㅝ, ㅙ 준말",1,"ㅗ·ㅜ + -아/-어 → ㅘ·ㅝ(봐, 줘, 뒀다). 놓아→놔. ㅚ + -어/-었 → ㅙ·ㅙㅆ(<b>돼, 됐다, 봬, 뵀다</b>).","돼요(○)/되요(×), 됐다(○)/됬다(×), 봬요(○)/뵈요(×)"],
r36:["제36~38항 ㅕ, ㅐ·ㅟ 준말",2,"ㅣ+-어 → ㅕ(가져, 다녀, 견뎌). ㅏ·ㅕ·ㅗ·ㅜ·ㅡ + -이- → ㅐ·ㅖ·ㅚ·ㅟ·ㅢ(쌔다, 폐다, 뵈다, 뉘다, 띄다). -이어 → 쌔어/싸여, 뵈어/보여, 씌어/쓰여.","가졌다, 견뎠다, 막혔다"],
r39:["제39항 -잖-, -찮-",1,"-지 않- → -잖-, -하지 않- → -찮-.","그렇잖은, 적잖은 / 만만찮다, 변변찮다"],
r40:["제40항 '하'의 준말",1,"'하'의 ㅏ가 줄고 ㅎ이 다음 소리와 어울리면 <b>거센소리</b>로(간편케, 다정타, 흔타, 연구토록). ★붙임2: <b>안울림소리(ㄱ·ㄷ·ㅂ 등) 뒤</b>에서 '하'가 아주 줄면 준 대로(<b>거북지, 넉넉지, 생각건대, 섭섭지, 깨끗지, 익숙지</b>). 붙임3: 부사는 소리대로(결코, 무심코, 아무튼, 하여튼, 하마터면, 요컨대, 한사코).","생각건대(○)/생각컨대(×), 익숙지(○)/익숙치(×)"],
r41:["제41항 조사",1,"조사는 앞말에 붙여 쓴다.","꽃이나마, 꽃처럼, 꽃에서부터, 어디까지나, 웃고만"],
r42:["제42항 의존 명사",1,"의존 명사는 띄어 쓴다.","아는 것이 힘이다 / 할 수 있다 / 먹을 만큼 / 떠난 지가 오래다"],
r43:["제43항 단위 명사",1,"단위를 나타내는 명사는 띄어 쓴다. 다만 <b>순서</b>를 나타내거나 <b>숫자</b>와 어울리면 붙여 쓸 수 있다.","소 한 마리, 신 두 켤레 / 제일과, 삼학년, 10개, 2대대"],
r46:["제46항 단음절 연속",2,"단음절 단어가 연이어 나타나면 붙여 쓸 수 있다.","그때 그곳, 좀더 큰것, 이말 저말, 한잎 두잎"],
r47:["제47항 보조 용언",1,"보조 용언은 띄어 씀이 원칙, 붙여 씀도 허용(꺼져 간다/꺼져간다, 올 듯하다/올듯하다). 다만 앞말에 <b>조사</b>가 붙거나, 앞말이 <b>합성 동사</b>이거나, 중간에 <b>조사</b>가 들어가면 반드시 띄어 쓴다.","잘도 놀아만 나는구나 / 덤벼들어 보아라 / 올 듯도 하다 / 잘난 체를 한다"],
r51:["제51항 -이/-히 ★어려운 부분",1,"분명히 '이'로만 나면 -이, '히'로만 나거나 '이·히' 둘 다 나면 -히. 요령: <b>ㅅ 받침 뒤, ㅂ불규칙, 첩어, '-하다'가 안 붙는 말 → -이</b> / <b>'-하다'가 붙는 말(ㅅ 받침 제외) → -히</b>.","깨끗이, 가까이, 번번이, 일일이, 틈틈이, 많이 / 극히, 특히, 솔직히, 꼼꼼히, 열심히, 도저히"],
r53:["제53항 예사소리 어미 ★수행 반드시",1,"-(으)ㄹ거나, -ㄹ걸, -ㄹ게, -ㄹ세, -ㄹ세라, -ㄹ수록, -ㄹ시, -ㄹ지, -ㄹ지라도, -ㄹ지언정, -ㄹ진대, -올시다 등은 <b>예사소리</b>로. 다만 <b>의문 어미</b> -ㄹ까?, -ㄹ꼬?, -ㅂ니까?, -리까?, -ㄹ쏘냐?는 된소리로.","할게(○)/할께(×), 갈수록(○)/갈쑤록(×), 할까?(○)"],
r56:["제56항 -더라, -던, -든지 ★수행",1,"지난 일을 나타내는 어미는 <b>-더라, -던</b>. 가리지 않는(선택) 뜻은 <b>-든지</b>.","춥더라, 깊던, 놀랐던지 몰라 / 배든지 사과든지"],
r57:["제57항 구별해 적는 말",1,"뜻에 따라 구별해 적는다. ★거치다/걷히다, 반드시/반듯이, 어름/얼음은 예가 시험에 나옴. 그 밖에 가름/갈음, 거름/걸음, 걷잡다/겉잡다, 그러므로/그럼으로써, 노름/놀음, 느리다/늘이다/늘리다, 다리다/달이다, 다치다/닫히다/닫치다, 마치다/맞히다, 목거리/목걸이, 바치다/받치다/받히다/밭치다, 부딪치다/부딪히다, 부치다/붙이다, 시키다/식히다, 아름/알음/앎, 안치다/앉히다, 이따가/있다가, 저리다/절이다, 조리다/졸이다, 주리다/줄이다, 하노라고/하느라고, -(으)러/-(으)려, -(으)로서/-(으)로써, -(으)므로/-(으)ㅁ으로(써).","거치다(영월을 거쳐 왔다) / 걷히다(외상값이 걷힌다) · 반드시(꼭) / 반듯이(반듯하게) · 어름(경계) / 얼음"],
r3:["제3항 외래어",2,"외래어는 '외래어 표기법'에 따라 적는다.","—"],
r11b:["제11항 붙임2 외자 이름",2,"외자로 된 이름을 성에 붙여 쓸 경우에도 본음대로 적을 수 있다.","신립(申砬), 최린(崔麟), 채륜(蔡倫), 하륜(河崙)"],
r7:["제7항 'ㄷ' 소리 받침",2,"'ㄷ' 소리로 나는 받침 중 'ㄷ'으로 적을 근거가 없는 것은 <b>'ㅅ'</b>으로 적는다.","덧저고리, 돗자리, 엇셈, 웃어른, 핫옷, 무릇, 사뭇, 얼핏, 자칫하면, 뭇, 옛, 첫, 헛"],
r20:["제20항 명사 + -이",2,"명사 뒤에 '-이'가 붙어서 된 말은 명사의 원형을 밝힌다(곳곳이, 낱낱이, 샅샅이, 집집이 / 바둑이, 절름발이). 붙임: '-이' 이외의 모음 접미사가 붙으면 원형을 밝히지 않는다(꼬락서니, 끄트머리, 바가지, 바깥, 사타구니, 싸라기, 이파리, 지붕, 지푸라기, 짜개).","샅샅이, 바둑이 / 지붕, 바깥, 이파리"],
r21:["제21항 자음 접미사",2,"명사나 어간 뒤에 자음으로 시작된 접미사가 붙으면 원형을 밝힌다(값지다, 넋두리, 빛깔, 잎사귀, 낚시, 덮개, 굵다랗다, 넓적하다, 높다랗다, 깊숙하다). 다만 ① 겹받침의 끝소리가 드러나지 않는 것(<b>널따랗다, 널찍하다, 얄따랗다, 얄팍하다, 짤따랗다, 짤막하다, 말끔하다, 말쑥하다, 실컷</b>) ② 어원이 불분명하거나 본뜻에서 멀어진 것(넙치, 올무, 골막하다, 납작하다)은 소리대로.","넓적하다(○) vs 널찍하다(○) / 넓직하다(×)"],
r22a:["제22항-1 사동·피동 접미사 등",2,"어간에 -기-, -리-, -이-, -히-, -구-, -우-, -추-, -으키-, -이키-, -애-가 붙으면 어간을 밝힌다(맡기다, 옮기다, 쫓기다, 뚫리다, 쌓이다, 굳히다, 넓히다, 갖추다, 맞추다, 일으키다, 돌이키다, 없애다). 다만 본뜻에서 멀어지면 소리대로(도리다, 드리다, 고치다, 바치다, 부치다, 거두다, 미루다, 이루다). 붙임: -업-, -읍-, -브-가 붙으면 소리대로(미덥다, 우습다, 미쁘다).","일으키다(○)/이르키다(×), 미덥다"],
r23:["제23항 -하다/-거리다 어근 + -이",2,"'-하다'나 '-거리다'가 붙는 어근에 '-이'가 붙어 명사가 되면 원형을 밝힌다(깔쭉이, 꿀꿀이, 눈깜짝이, 배불뚝이, 오뚝이, 홀쭉이). 붙임: 붙을 수 없는 어근은 밝히지 않는다(<b>개구리, 귀뚜라미, 기러기, 깍두기, 꽹과리, 동그라미, 딱따구리, 매미, 부스러기, 뻐꾸기</b>).","개굴거리다(×) → 개구리 / 꿀꿀거리다(○) → 꿀꿀이"],
r24:["제24항 -거리다 어근 + -이다",2,"'-거리다'가 붙는 시늉말 어근에 '-이다'가 붙은 용언은 어근을 밝힌다.","깜짝이다, 끄덕이다, 뒤척이다, 망설이다, 속삭이다, 움직이다, 지껄이다, 허덕이다, 헐떡이다"],

/* ========== 유틸 ========== */
const $=s=>document.querySelector(s);
const app=$("#app");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=(a,n)=>shuffle(a).slice(0,n);
const norm=s=>s.replace(/\s/g,"");
let WRONG={};
try{WRONG=JSON.parse(localStorage.getItem("kor-wrong")||"{}")}catch(e){}
const saveW=()=>{try{localStorage.setItem("kor-wrong",JSON.stringify(WRONG))}catch(e){}};
const markW=(id,bad)=>{if(bad){WRONG[id]=(WRONG[id]||0)+1}else if(WRONG[id]){delete WRONG[id]}saveW()};

/* ========== 문제 만들기 ========== */
function idiomDistractors(it){
  const g=GROUPS.find(x=>x.includes(it[0]))||[];
  let pool=shuffle(g.filter(x=>x!==it[0]));
  const others=shuffle(IDIOMS.map(x=>x[0]).filter(x=>x!==it[0]&&!pool.includes(x)));
  return pool.concat(others).slice(0,3);
}
const mk={
  idT:it=>({t:"idT",id:"i:"+it[0],it}),
  idM:it=>({t:"idM",id:"i:"+it[0],it,opts:shuffle([it[0]].concat(idiomDistractors(it)))}),
  gC:p=>({t:"gC",id:"g:"+p.c,p,opts:shuffle([p.c,p.w])}),
  gF:p=>{const toks=p.s.split(" ");const k=toks.findIndex(x=>x.includes("{}"));return{t:"gF",id:"g:"+p.c,p,toks:toks.map(x=>x.replace("{}",p.w)),k}},
  gQ:q=>({t:"gQ",id:"c:"+q[0].slice(0,30),q,opts:shuffle(q[1].map((x,i)=>({x,ok:i===q[2]})))})
};
const canF=p=>p.s&&!p.sp&&!p.w.includes(" ")&&!p.c.includes(" ");

/* ========== 화면 ========== */
let S=null; // session
function home(){
  S=null;
  const wn=Object.keys(WRONG).length;
  app.innerHTML=`
  <header><h1>국어 수행 카드 📚</h1></header>
  <div class="grid">
    <button class="btn-card hero" data-go="mock"><b>🎯 실전 모의 22문제</b><span>사자성어 9 + 맞춤법 13, 무작위 섞기</span></button>
  </div>
  <div class="sec">사자성어 (59개)</div>
  <div class="grid">
    <button class="btn-card" data-go="idT"><b>✍️ 뜻 보고 쓰기</b><span>실제 시험처럼 직접 입력</span></button>
    <button class="btn-card" data-go="idM"><b>🔘 뜻 보고 고르기</b><span>헷갈리는 것끼리 보기</span></button>
    <button class="btn-card" data-go="idF"><b>🃏 플래시카드</b><span>뜻 ↔ 성어 넘겨 보기</span></button>
    <button class="btn-card" data-go="idList"><b>📋 전체 목록</b><span>한자·뜻 한눈에</span></button>
  </div>
  <div class="sec">맞춤법 (한글 맞춤법의 원리)</div>
  <div class="grid">
    <button class="btn-card" data-go="gF"><b>🔍 틀린 곳 찾기</b><span>문장에서 틀린 낱말 누르기</span></button>
    <button class="btn-card" data-go="gC"><b>⚖️ 바른 표기 고르기</b><span>띄어쓰기 포함</span></button>
    <button class="btn-card" data-go="gQ"><b>💡 개념 문제</b><span>규정 내용 확인</span></button>
    <button class="btn-card" data-go="rules"><b>📖 요점 정리</b><span>프린트 전체 규정 + ★핵심</span></button>
  </div>
  <div class="sec">복습</div>
  <div class="grid">
    <button class="btn-card" data-go="wrong" style="grid-column:1/-1"><b>❗ 틀린 문제만 다시 ${wn?`<span class="pill">${wn}</span>`:""}</b><span>${wn?"맞히면 목록에서 빠져요":"아직 틀린 문제가 없어요"}</span></button>
  </div>
  <p class="note">프린트 전 범위(X 표시한 항 포함)가 들어 있어요. 요점 정리의 ★는 선생님이 별표·동그라미·"시험", "수행 나옴"으로 표시한 핵심이에요. 틀린 기록은 이 기기의 브라우저에만 저장돼요.</p>`;
  app.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));
}
function go(m){
  const ids=IDIOMS, gp=PAIRS, fp=PAIRS.filter(canF);
  let qs;
  if(m==="mock"){
    const it=pick(ids,9);
    qs=it.slice(0,5).map(mk.idT).concat(it.slice(5).map(mk.idM));
    const f=pick(fp,5), used=new Set(f.map(p=>p.c));
    const c=pick(gp.filter(p=>!used.has(p.c)),5);
    qs=qs.concat(f.map(mk.gF),c.map(mk.gC),pick(CQ,3).map(mk.gQ));
    qs=shuffle(qs);
    return start("실전 모의 22문제",qs);
  }
  if(m==="idT")return start("뜻 보고 쓰기",pick(ids,20).map(mk.idT));
  if(m==="idM")return start("뜻 보고 고르기",pick(ids,20).map(mk.idM));
  if(m==="idF")return flash();
  if(m==="idList")return idList();
  if(m==="gF")return start("틀린 곳 찾기",pick(fp,20).map(mk.gF));
  if(m==="gC")return start("바른 표기 고르기",pick(gp,20).map(mk.gC));
  if(m==="gQ")return start("개념 문제",shuffle(CQ).map(mk.gQ));
  if(m==="rules")return rules();
  if(m==="wrong"){
    const keys=Object.keys(WRONG);
    if(!keys.length)return;
    qs=keys.map(k=>{
      if(k.startsWith("i:")){const it=ids.find(x=>x[0]===k.slice(2));return it&&mk.idT(it)}
      if(k.startsWith("g:")){const p=gp.find(x=>x.c===k.slice(2));return p&&(canF(p)&&Math.random()<.5?mk.gF(p):mk.gC(p))}
      if(k.startsWith("c:")){const q=CQ.find(x=>("c:"+x[0].slice(0,30))===k);return q&&mk.gQ(q)}
    }).filter(Boolean);
    return start("틀린 문제 다시",shuffle(qs));
  }
}
function start(title,qs){S={title,qs,i:0,score:0,miss:[]};render()}
function head(){
  return `<header><button class="back" id="bk">← 홈</button><h1>${esc(S.title)}</h1></header>
  <div class="meta"><span>${S.i+1} / ${S.qs.length}</span><span>맞힘 ${S.score}</span></div>
  <div class="bar"><i style="width:${(S.i/S.qs.length)*100}%"></i></div>`;
}
function ruleBox(r,n){const R=RULES[r];if(!R)return"";return `<div class="rule"><b>${R[0]}</b> — ${R[2]}${n?`<br>👉 ${esc(n)}`:""}</div>`}
function render(){
  const q=S.qs[S.i];
  let body="";
  if(q.t==="idT"){
    body=`<span class="tag">사자성어 · 쓰기</span><div class="q">${esc(q.it[2])}</div>
    <input class="ans" id="ans" placeholder="네 글자로 입력" autocomplete="off" lang="ko">
    <button class="primary" id="sub">확인</button><button class="ghost" id="skip">모르겠어요</button><div id="fb"></div>`;
  }else if(q.t==="idM"){
    body=`<span class="tag">사자성어 · 고르기</span><div class="q">${esc(q.it[2])}</div><div class="opts">${q.opts.map(o=>`<button class="opt" data-v="${esc(o)}">${esc(o)}</button>`).join("")}</div><div id="fb"></div>`;
  }else if(q.t==="gC"){
    const prompt=q.p.sp?"띄어쓰기가 바른 것은?":(q.p.s?`<span style="color:var(--sub);font-size:14px">바른 표기는?</span><br>${esc(q.p.s).replace("{}","<u>&nbsp;( ? )&nbsp;</u>")}`:"바른 표기는?");
    body=`<span class="tag">맞춤법 · 고르기</span><div class="q">${prompt}</div><div class="opts">${q.opts.map(o=>`<button class="opt" data-v="${esc(o)}">${esc(o)}</button>`).join("")}</div><div id="fb"></div>`;
  }else if(q.t==="gF"){
    body=`<span class="tag">맞춤법 · 틀린 곳 찾기</span><div class="q">맞춤법이 <b>틀린 낱말</b>을 누르세요.</div><div class="tokens">${q.toks.map((t,i)=>`<button class="tok" data-i="${i}">${esc(t)}</button>`).join("")}</div><div id="fb"></div>`;
  }else if(q.t==="gQ"){
    body=`<span class="tag">맞춤법 · 개념</span><div class="q">${esc(q.q[0])}</div><div class="opts">${q.opts.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o.x)}</button>`).join("")}</div><div id="fb"></div>`;
  }
  app.innerHTML=head()+`<div class="card">${body}</div>`;
  $("#bk").onclick=home;
  if(q.t==="idT"){
    const inp=$("#ans");setTimeout(()=>inp.focus(),50);
    const sub=()=>{if(q.done)return next();const v=norm(inp.value);if(!v)return;answer(v===q.it[0])};
    $("#sub").onclick=sub;inp.onkeydown=e=>{if(e.key==="Enter"&&!e.isComposing)sub()};
    $("#skip").onclick=()=>{if(!q.done)answer(false)};
  }
  if(q.t==="idM"||q.t==="gC"){app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(q.done)return;const ok=b.dataset.v===(q.t==="idM"?q.it[0]:q.p.c);app.querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(x.dataset.v===(q.t==="idM"?q.it[0]:q.p.c))x.classList.add("ok")});if(!ok)b.classList.add("no");answer(ok)})}
  if(q.t==="gQ"){app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(q.done)return;const i=+b.dataset.i;app.querySelectorAll(".opt").forEach((x,j)=>{x.disabled=true;if(q.opts[j].ok)x.classList.add("ok")});if(!q.opts[i].ok)b.classList.add("no");answer(q.opts[i].ok)})}
  if(q.t==="gF"){app.querySelectorAll(".tok").forEach(b=>b.onclick=()=>{if(q.done)return;const i=+b.dataset.i;const t=app.querySelectorAll(".tok");t[q.k].classList.add("ok");t[q.k].textContent=q.toks[q.k]+" → "+q.p.s.split(" ")[q.k].replace("{}",q.p.c);if(i!==q.k)b.classList.add("no");answer(i===q.k)})}
}
function answer(ok){
  const q=S.qs[S.i];q.done=true;
  if(ok)S.score++;else S.miss.push(q);
  markW(q.id,!ok);
  let ex="";
  if(q.t==="idT"||q.t==="idM")ex=`<div class="big">${esc(q.it[0])}</div><div>${esc(q.it[1])}</div>`;
  if(q.t==="gC"||q.t==="gF")ex=`<div>✅ <b>${esc(q.p.c)}</b> &nbsp; ❌ <s>${esc(q.p.w)}</s></div>`+ruleBox(q.p.r,q.p.n);
  if(q.t==="gQ")ex=`<div>정답: <b>${esc(q.q[1][q.q[2]])}</b></div>`+ruleBox(q.q[3],"");
  $("#fb").innerHTML=`<div class="fb ${ok?"ok":"no"}"><div class="v">${ok?"정답이에요!":"아쉬워요"}</div>${ex}</div><button class="primary" id="nx">${S.i+1<S.qs.length?"다음 →":"결과 보기"}</button>`;
  if(q.t==="idT"){$("#sub").style.display="none";$("#skip").style.display="none";$("#ans").disabled=true}
  $("#nx").onclick=next;$("#nx").focus();
}
function next(){S.i++;if(S.i>=S.qs.length)return result();render()}
function result(){
  const pct=Math.round(S.score/S.qs.length*100);
  const line=q=>{if(q.it)return `<div class="wl">${esc(q.it[2])}<br>→ <b>${esc(q.it[0])}</b> (${esc(q.it[1])})</div>`;if(q.p)return `<div class="wl"><b>${esc(q.p.c)}</b> (❌ <s>${esc(q.p.w)}</s>) · ${RULES[q.p.r][0]}</div>`;return `<div class="wl">${esc(q.q[0])}<br>→ <b>${esc(q.q[1][q.q[2]])}</b></div>`};
  app.innerHTML=`<header><button class="back" id="bk">← 홈</button><h1>${esc(S.title)} 결과</h1></header>
  <div class="card"><div class="score">${S.score} / ${S.qs.length}</div><p style="text-align:center;color:var(--sub);margin:0">${pct>=90?"완벽에 가까워요! 🎉":pct>=70?"좋아요, 틀린 것만 한 번 더!":"틀린 문제 위주로 다시 풀어 봐요"}</p>
  ${S.miss.length?`<div class="sec">틀린 문제</div>${S.miss.map(line).join("")}`:""}
  <button class="primary" id="again">같은 유형 다시</button><button class="ghost" id="hm">홈으로</button></div>`;
  const t=S.title;
  $("#bk").onclick=home;$("#hm").onclick=home;
  $("#again").onclick=()=>{const map={"실전 모의 22문제":"mock","뜻 보고 쓰기":"idT","뜻 보고 고르기":"idM","틀린 곳 찾기":"gF","바른 표기 고르기":"gC","개념 문제":"gQ","틀린 문제 다시":"wrong"};const m=map[t];if(m==="wrong"&&!Object.keys(WRONG).length)return home();go(m)};
}
function flash(){
  let deck=shuffle(IDIOMS),i=0,front=true,dir="m";
  const draw=()=>{
    if(i>=deck.length){app.innerHTML=`<header><button class="back" id="bk">← 홈</button><h1>플래시카드</h1></header><div class="card"><div class="score">끝! 🎉</div><p style="text-align:center;color:var(--sub)">"몰라요" 누른 카드는 '틀린 문제만 다시'에 들어갔어요.</p><button class="primary" id="re">처음부터</button></div>`;$("#bk").onclick=home;$("#re").onclick=flash;return}
    const it=deck[i];
    const f=dir==="m"?`<div class="q" style="margin:0">${esc(it[2])}</div>`:`<div class="big">${esc(it[0])}</div>`;
    const b=`<div class="big">${esc(it[0])}</div><div style="color:var(--sub)">${esc(it[1])}</div><div style="margin-top:10px">${esc(it[2])}</div>`;
    app.innerHTML=`<header><button class="back" id="bk">← 홈</button><h1>플래시카드</h1></header>
    <div class="seg"><button class="${dir==="m"?"on":""}" data-d="m">뜻 → 성어</button><button class="${dir==="w"?"on":""}" data-d="w">성어 → 뜻</button></div>
    <div class="meta"><span>${i+1} / ${deck.length}</span><span></span></div><div class="bar"><i style="width:${i/deck.length*100}%"></i></div>
    <div class="card flip" id="fc">${front?f:b}<div class="hint">${front?"눌러서 뒤집기":""}</div></div>
    <div class="row" style="margin-top:12px"><button class="primary no-btn" id="no">몰라요</button><button class="primary" id="yes">알아요</button></div>`;
    $("#bk").onclick=home;
    $("#fc").onclick=()=>{front=!front;draw()};
    app.querySelectorAll("[data-d]").forEach(x=>x.onclick=()=>{dir=x.dataset.d;front=true;draw()});
    $("#no").onclick=()=>{markW("i:"+it[0],true);i++;front=true;draw()};
    $("#yes").onclick=()=>{i++;front=true;draw()};
  };
  draw();
}
function idList(){
  app.innerHTML=`<header><button class="back" id="bk">← 홈</button><h1>사자성어 목록</h1></header>
  <div class="card">${IDIOMS.map(it=>`<div class="rule-item"><h3>${esc(it[0])} <span style="color:var(--sub);font-weight:400">${esc(it[1])}</span></h3><p>${esc(it[2])}</p></div>`).join("")}</div>`;
  $("#bk").onclick=home;
}
function rules(){
  app.innerHTML=`<header><button class="back" id="bk">← 홈</button><h1>맞춤법 요점 정리</h1></header>
  <p class="note" style="margin-top:0"><span class="star">★</span> = 선생님이 별표·동그라미·"시험" 표시한 핵심</p>
  <div class="card">${RULE_ORDER.map(k=>{const R=RULES[k];return `<div class="rule-item"><h3>${R[1]===1?'<span class="star">★</span> ':""}${R[0]}</h3><p>${R[2]}</p><div class="ex">예) ${esc(R[3])}</div></div>`}).join("")}</div>`;
  $("#bk").onclick=home;
}
home();
